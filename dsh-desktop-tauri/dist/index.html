<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSH Desktop</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #101014; color: #e6e6ea;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  #box { width: min(560px, 90vw); text-align: center; }
  .logo {
    font-size: 56px; font-weight: 700; letter-spacing: 0.1em;
    background: linear-gradient(120deg, #3f5efb, #8f7bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 18px;
  }
  #status { font-size: 15px; opacity: 0.9; min-height: 1.4em; }
  .spinner {
    width: 28px; height: 28px; margin: 18px auto; border-radius: 50%;
    border: 3px solid #2a2a33; border-top-color: #3f5efb;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #log {
    margin-top: 22px; text-align: left; font-size: 11px; line-height: 1.5;
    color: #7d7d88; max-height: 180px; overflow: auto; white-space: pre-wrap;
    background: #16161c; border-radius: 8px; padding: 10px 12px;
  }
  #actions { margin-top: 20px; display: none; gap: 12px; justify-content: center; }
  button {
    background: #26262f; color: #e6e6ea; border: 1px solid #34343f;
    border-radius: 6px; padding: 8px 18px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #2e2e3a; }
</style>
</head>
<body>
  <div id="box">
    <div class="logo">DSH</div>
    <div class="spinner" id="spinner"></div>
    <div id="status">正在启动 DSH 服务…</div>
    <div id="actions">
      <button id="restart">重启服务</button>
      <button id="quit">退出</button>
    </div>
    <pre id="log"></pre>
  </div>
<script>
  const { invoke } = window.__TAURI__.core;
  const $ = (id) => document.getElementById(id);
  let navigated = false;

  function setState(st) {
    const status = $('status');
    const actions = $('actions');
    const spinner = $('spinner');
    $('log').textContent = (st.log || []).slice(-40).join('\n');
    const budget = st.restarts > 0 ? `（重启额度 ${st.restarts}/${st.maxRestarts}）` : '';
    const exhausted = st.restarts >= st.maxRestarts;
    switch (st.state) {
      case 'idle':
        status.textContent = `正在启动 DSH 服务…${budget}`;
        break;
      case 'spawning':
        status.textContent = `正在启动 DSH 服务（端口 ${st.port ?? '?'}）…${budget}`;
        break;
      case 'ready':
        status.textContent = '服务已就绪，正在打开界面…（若未自动打开，点击“重启服务”）';
        break;
      case 'exited':
        spinner.style.display = 'none';
        actions.style.display = 'flex';
        status.textContent = exhausted
          ? `DSH 服务已退出（code: ${st.exit_code ?? '?'}）；自动重启额度已用尽，点“重启服务”恢复`
          : `DSH 服务已退出（code: ${st.exit_code ?? '?'}）`;
        break;
      case 'error':
        spinner.style.display = 'none';
        actions.style.display = 'flex';
        status.textContent = exhausted
          ? `${st.error || '启动失败'}（自动重启额度已用尽，点“重启服务”恢复）`
          : (st.error || '启动失败');
        break;
    }
  }

  async function poll() {
    if (navigated) return;
    let st;
    try {
      st = await invoke('server_status');
    } catch (e) {
      $('status').textContent = '外壳内部错误: ' + e;
      setTimeout(poll, 1000);
      return;
    }
    setState(st);
    // No navigation from here: DSH auth cookies are SameSite=Strict, so the
    // shell itself opens the token URL in a window whose origin is the host.
    setTimeout(poll, 600);
  }

  $('restart').addEventListener('click', () => {
    invoke('restart_server_cmd').catch((e) => { $('status').textContent = '重启请求失败: ' + e; });
    setTimeout(poll, 300);
  });
  $('quit').addEventListener('click', () => { invoke('quit_app').catch(() => {}); });

  // The shell reloads this page after a restart; a reload already resets the
  // visible state, so no cross-reload flag is needed.
  poll();
</script>
</body>
</html>
