    type: String
    default: "1.0"
    group: sampling
    tooltip: "动态温度指数。控制温度调整的曲线形状，默认 1.0（线性）。仅在 dynatemp-range > 0 时生效。"

  - flag: top-k
    subgroup: 基础采样
