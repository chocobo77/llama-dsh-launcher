# =====================================================================
# LlamaDSH 启动器 · llama.cpp 启动参数配置（唯一升级入口）
# 加载顺序: 内置默认 → 本文件(优先) → ~/.llamadsh/params_override.yml(差异覆盖)
# =====================================================================
meta:
  schema: 1
  adapt: "llama.cpp b5998+（master b10605 已验证）"
  notes: >
    llama.cpp 更新时的维护方法（改完点启动器"⟳ 重载参数配置"即时生效）:
    1. 新增参数: 在 params 下加一条, 必填 flag/label/type/default/group
    2. 改名参数: 更新 flag, 并把旧名写进 aliases, 旧 profile 的值会自动迁移
    3. 弃用参数: 设 deprecated: true 或在 override 层 hidden: true
    4. role 是启动器内部逻辑(显存估算/归一化)绑定的语义名, 改 flag 时保留 role 原值即可

groups:
  - {id: basics,    title: 基础设置,   order: 0}
  - {id: perf,      title: 性能与内存, order: 1}
  - {id: kv,        title: KV 缓存,    order: 2}
  - {id: moe,       title: MOE 专家,   order: 3}
  - {id: sampling,  title: 采样控制,   order: 4}
  - {id: spec,      title: 推测解码,   order: 5}
  - {id: mm,        title: 多模态,     order: 6}
  - {id: parallel,  title: 并行与序列, order: 7}
  - {id: template,  title: 模板与对话, order: 8}
  - {id: ext,       title: 扩展功能,   order: 9}

params:
  # ---------------- 基础设置 ----------------
  # API 返回中的模型标识名
  - flag: alias
    label: 别名 (Alias)
    type: String
    default: "qwen3.8-27b"
    group: basics
    enabled: true
    tooltip: "模型别名，用于 API 返回中的 model 字段标识。建议设为模型简称，方便上层应用识别。"
  # 监听地址；0.0.0.0 允许局域网访问
  - flag: host
    label: 主机 (Host)
    role: host
    type: String
    default: "127.0.0.1"
    group: basics
    enabled: true
    tooltip: "监听 IP 地址。127.0.0.1 仅本机可访问；0.0.0.0 允许局域网访问（注意安全风险）。也支持 UNIX socket 路径（以 .sock 结尾）。建议：本地使用保持 127.0.0.1。"
  # HTTP 监听端口
  - flag: port
    label: 端口 (Port)
    role: port
    type: String
    default: "1234"
    group: basics
    enabled: true
    tooltip: "HTTP 监听端口，范围 1-65535。llama-server 默认 8080，此启动器默认 1234 以避免与其他服务冲突。"
  # 空闲连接读写超时(秒)，0=永不超时
  - flag: timeout
    label: 超时 (Timeout)
    type: String
    default: "600"
    group: basics
    enabled: true
    tooltip: "llama-server 读写超时（秒）。超时后断开空闲连接。长文本生成建议 >=300s，多轮对话建议 600s。设为 0 表示永不超时。"
  # 上下文窗口长度；越大越占显存，支持 K/M 后缀
  - flag: ctx-size
    label: 上下文大小 (Context)
    role: ctx_size
    type: String
    default: "49152"
    group: basics
    enabled: true
    tooltip: "Prompt 上下文窗口长度（token 数）。决定单次对话能处理的最大 token 量。支持 K/M 后缀（如 100K=102400）。越大越占显存：27B Q4 模型约 16GB，24GB 显卡 + q4_0 KV 时建议 <=48K；100K 以上预计总占用超 23GB，极易 OOM 崩溃。启动前会自动估算显存并预警。默认 0 = 从模型元数据读取。"
  # prompt 处理逻辑批大小
  - flag: batch-size
    label: 批处理大小 (Batch Size)
    role: batch_size
    type: String
    default: "2048"
    group: basics
    enabled: true
    tooltip: "逻辑最大批处理大小。控制 prompt 处理时一次送入模型的 token 上限。增大可加速 prompt 处理但增加显存占用。默认 2048，24GB 显卡建议 2048~4096。"
  # 物理微批大小，必须 <= batch-size
  - flag: ubatch-size
    label: 微批大小 (Ubatch)
    role: ubatch_size
    type: String
    default: "512"
    group: basics
    enabled: true
    validate: {leq: batch-size}
    tooltip: "物理微批处理大小。实际每次送入推理引擎的 token 数，必须 <= batch-size。较小值降低延迟但降低吞吐。默认 512，显存充裕可提至 1024。"
  # 生成阶段 CPU 线程数，$cpu=物理核心数
  - flag: threads
    label: 线程数 (Threads)
    role: threads
    type: String
    default: "$cpu"
    group: basics
    enabled: true
    tooltip: "生成阶段使用的 CPU 线程数。默认 -1 = 自动（使用全部物理核心）。建议设为 CPU 物理核心数（不含超线程），过多反而因上下文切换降低性能。"
  # 卸载到 GPU 的层数，0=纯CPU 99=全部
  - flag: n-gpu-layers
    label: GPU 层数
    role: ngl
    type: String
    default: "99"
    group: basics
    enabled: true
    tooltip: "卸载到 GPU 的模型层数。0=纯 CPU；99=尽可能全部卸载。27B Q4 模型约需 99 层全卸载到 24GB 显卡。设为 auto 可自动计算。显存不足时逐层减少。"
  # 多卡时存放中间结果与 KV 的主卡编号
  - flag: main-gpu
    label: 主 GPU 编号
    type: String
    default: "0"
    group: basics
    enabled: true
    tooltip: "主 GPU 设备编号（从 0 开始）。单卡用户保持 0。多卡时指定存放中间结果和 KV 缓存的 GPU。"
  # HTTP 请求处理线程数，-1=自动
  - flag: threads-http
    label: HTTP 线程数
    type: String
    default: "-1"
    group: basics
    tooltip: "处理 HTTP 请求的线程数。默认 -1 = 自动（通常为 8）。高并发场景可适当增加，但过多会与推理线程争抢 CPU。建议：单用户保持 -1；多用户可设 4~8。"
  # API 认证密钥，逗号分隔多个
  - flag: api-key
    label: API 密钥
    type: String
    default: ""
    group: basics
    tooltip: "API 认证密钥，多个用逗号分隔。留空表示无需认证。暴露在公网时务必设置，否则任何人都能调用你的模型。"
  # TLS 私钥(PEM)
  - flag: ssl-key-file
    label: SSL 私钥文件
    type: String
    default: ""
    group: basics
    suggests: [ssl-cert-file]
    tooltip: "PEM 格式的 SSL 私钥文件路径。与证书文件配合启用 HTTPS 加密通信。本地使用无需设置。"
  # TLS 证书(PEM)
  - flag: ssl-cert-file
    label: SSL 证书文件
    type: String
    default: ""
    group: basics
    suggests: [ssl-key-file]
    tooltip: "PEM 格式的 SSL 证书文件路径。需与私钥文件配对使用。可用 Let's Encrypt 等免费证书。"
  # 跨域允许来源，逗号分隔
  - flag: cors-origins
    label: CORS 允许来源
    type: String
    default: ""
    group: basics
    tooltip: "跨域资源共享（CORS）允许的来源列表，逗号分隔。留空默认允许所有来源（*）。Web 前端跨域访问时需设置为前端域名。设为 localhost 只反射本机 Origin。"
  # ---------------- 性能与内存 ----------------
  # Flash Attention 加速，需 Ampere+/RDNA2+
  - flag: flash-attn
    label: Flash Attention
    type: Combo
    default: "on"
    group: perf
    enabled: true
    options: [on, off, auto]
    tooltip: "Flash Attention 加速。需要 GPU 硬件支持（AMD RDNA2+/NVIDIA Ampere+）。可显著降低长上下文的显存占用并加速推理。推荐 on；若启动报错则改 auto。"
  # 多 GPU 显存分配比例，逗号分隔
  - flag: tensor-split
    label: 张量拆分
    type: String
    default: ""
    group: perf
    tooltip: "多 GPU 张量拆分比例，逗号分隔。如 '3,5' 表示第一块 GPU 占 3/8、第二块占 5/8。按显存大小比例分配。单卡无需设置。"
  # prompt 处理线程数，默认同 --threads
  - flag: threads-batch
    label: 批处理线程数
    type: String
    default: ""
    group: perf
    tooltip: "Prompt 处理（批处理）时的 CPU 线程数。默认与 --threads 相同。Prompt 处理是计算密集型，可适当增加线程数以加速首次响应。"
  # [已废弃] 禁用内存映射加载
  - flag: no-mmap
    label: 禁用 mmap
    type: Bool
    default: "false"
    group: perf
    advanced: true
    deprecated: true
    tooltip: "禁用内存映射（mmap）加载模型。mmap 允许操作系统按需加载模型片段，节省内存。禁用后加载更慢但可减少系统交换。一般保持关闭。已废弃，推荐使用 --load-mode。"
  # [已废弃] 锁定模型到物理内存
  - flag: no-mlock
    label: 禁用 mlock
    type: Bool
    default: "false"
    group: perf
    advanced: true
    deprecated: true
    tooltip: "锁定模型到物理内存（mlock），防止被操作系统交换到磁盘。可避免长时间运行后的性能抖动，但需要足够的物理内存。已废弃，推荐使用 --load-mode mlock。"
  # NUMA 内存分配策略，仅多路 CPU 有意义
  - flag: numa
    label: NUMA 策略
    type: Combo
    default: "disabled"
    group: perf
    options: [disabled, distribute, isolate, numactl]
    tooltip: "NUMA 内存分配策略。仅多路 CPU（服务器）有意义。distribute=均匀分配；isolate=限制在启动 CPU 节点；numactl=使用 numactl 工具的映射。单路 CPU/桌面用户保持 disabled。"
  # RoPE 基础频率，默认读模型元数据
  - flag: rope-freq-base
    label: RoPE 基础频率
    type: String
    default: ""
    group: perf
    tooltip: "RoPE 旋转位置编码的基础频率。默认从模型元数据读取。NTK-aware 缩放时可调大此值以扩展上下文。一般无需手动设置，除非模型训练时使用了非标准值。"
  # RoPE 缩放因子，N=上下文扩展 N 倍
  - flag: rope-freq-scale
    label: RoPE 频率缩放
    type: String
    default: "1.0"
    group: perf
    tooltip: "RoPE 频率缩放因子。值为 N 时上下文扩展 N 倍。与 rope-scale 互为倒数关系。1.0 = 不缩放。长上下文扩展时配合 rope-scaling 方法使用。"
  # ---------------- KV 缓存 ----------------
  # K 缓存量化类型，q4_0 最省显存
  - flag: cache-type-k
    label: Cache 类型 K
    role: cache_type_k
    type: Combo
    default: "q8_0"
    group: kv
    enabled: true
    options: [f16, q8_0, q4_0, q4_1, iq4_nl, q5_0, q5_1, q6_0]
    tooltip: "KV 缓存 K 分量的数据类型。精度越低越省显存，但可能影响生成质量。f16=高精度高显存；q8_0=平衡；q4_0=省显存。24GB 显卡跑 27B Q4 建议配 q4_0 以留出上下文空间；48K 上下文下 f16 亦可。"
  # V 缓存量化类型，V 对精度不敏感可更激进
  - flag: cache-type-v
    label: Cache 类型 V
    role: cache_type_v
    type: Combo
    default: "q4_0"
    group: kv
    enabled: true
    options: [f16, q8_0, q4_0, q4_1, iq4_nl, q5_0, q5_1, q6_0]
    tooltip: "KV 缓存 V 分量的数据类型。V 对精度不如 K 敏感，可更激进地压缩。24GB 显卡跑 27B Q4 建议 q4_0。f16 仅在显存充裕且追求最高质量时使用。"
  # 复用相同前缀的 KV 状态，多轮对话提速
  - flag: cache-prompt
    label: 缓存 Prompt
    type: Bool
    default: "false"
    group: kv
    advanced: true
    tooltip: "缓存 prompt 的 KV 状态，避免重复计算相同前缀。默认开启。多轮对话时可显著加速后续请求的首 token 延迟。建议保持开启。"
  # KV 偏移复用最小 chunk，需先启用 prompt 缓存
  - flag: cache-reuse
    label: 缓存重用阈值
    type: String
    default: "0"
    group: kv
    advanced: true
    requires:
      - {flag: cache-prompt, op: enabled}
    tooltip: "通过 KV 偏移复用缓存的最小 chunk 大小。需要启用 prompt 缓存。默认 0=禁用。设为 256~512 可在相似 prompt 间复用 KV，加速多轮对话。"
  # [已废弃] KV 碎片整理阈值，新版自动处理
  - flag: defrag-thold
    label: 碎片整理阈值
    type: String
    default: "-1.0"
    group: kv
    advanced: true
    deprecated: true
    tooltip: "KV 缓存碎片整理触发阈值。当碎片率超过此值时自动整理。默认 -1=自动。设为 0.1~0.5 可手动控制触发频率。注意：此参数已废弃，新版 llama.cpp 自动处理。"
  # ---------------- MOE 专家 ----------------
  # 全部专家权重留 CPU，仅共享权重进 GPU
  - flag: cpu-moe
    label: MoE 专家全CPU (cpu-moe)
    role: cpu_moe
    type: Bool
    default: "false"
    group: moe
    tooltip: "将混合专家(MoE)模型的全部专家权重保留在 CPU 内存，仅注意力等共享权重进 GPU。适合 24GB 显存运行超大 MoE 模型(如 GLM-4.5-Air、Qwen3-30B-A3B、DeepSeek 系列——这类模型原权重多为 safetensors 分片，需先转 GGUF)。比全 GPU 慢但远快于纯 CPU；专家不占显存后 -ngl 可保持较大值。仅对 MoE 模型有效。"
  # 前 N 层专家留 CPU 的折中方案
  - flag: n-cpu-moe
    label: MoE 专家CPU层数 (n-cpu-moe)
    role: n_cpu_moe
    type: String
    default: ""
    group: moe
    tooltip: "只把前 N 层的 MoE 专家权重放在 CPU，其余层专家留在 GPU——显存与速度的折中。与 cpu-moe 同时设置时以 llama.cpp 实际处理为准。建议从 0 开始逐步增大直到显存刚好不 OOM；经验值：24GB 显存 + 30B-A3B(Q4_K_M) 约 8~20。仅对 MoE 模型有效。"
  # ---------------- 采样控制 ----------------
  # RNG 种子，-1=每次随机
  - flag: seed
    label: 随机种子 (Seed)
    type: String
    default: "-1"
    group: sampling
    enabled: true
    tooltip: "RNG 随机种子。-1 = 每次随机（默认）。设为固定值可使相同输入产生相同输出，便于调试和复现。测试时建议固定种子，生产环境保持 -1。"
  # 单次最大生成 token，-1=无限
  - flag: predict
    label: 最大生成 Token
    type: String
    default: "-1"
    group: sampling
    tooltip: "单次请求最大生成 token 数。-1 = 无限（直到模型决定停止或达到上下文上限）。设为 512~2048 可防止模型过度生成。API 调用时通常由客户端的 max_tokens 参数覆盖。"
  # 采样温度：0=贪心，0.6~0.8=平衡
  - flag: temp
    label: 温度 (Temp)
    type: String
    default: "0.8"
    group: sampling
    enabled: true
    tooltip: "采样温度，控制输出随机性。0=确定性（贪心解码）；0.1~0.4=保守精确；0.6~0.8=平衡创意与连贯（推荐）；1.0+=高随机性。代码生成建议 0.1~0.3；对话建议 0.6~0.8；创意写作 0.8~1.2。"
  # 仅从概率前 K 的 token 采样
  - flag: top-k
    label: Top-K
    type: String
    default: "40"
    group: sampling
    enabled: true
    tooltip: "Top-K 采样：仅从概率最高的 K 个 token 中采样。K 越小输出越保守。默认 40。设为 1=贪心；10~40=平衡；0=禁用（仅用 Top-P/Min-P）。建议配合 Top-P 使用，保持默认 40。"
  # 核采样截断阈值
  - flag: top-p
    label: Top-P
    type: String
    default: "0.9"
    group: sampling
    enabled: true
    tooltip: "核采样（Nucleus Sampling）：从累计概率达到 P 的最小 token 集合中采样。P 越小输出越集中。默认 0.95。0.9=保守；1.0=禁用。建议 0.9~0.95，配合 Min-P 效果更佳。"
  # 相对最高概率的截断阈值
  - flag: min-p
    label: Min-P
    type: String
    default: "0.1"
    group: sampling
    enabled: true
    tooltip: "Min-P 采样：过滤掉概率低于最高概率 * min_p 的 token。比 Top-P 更直观的截断方式。默认 0.05。0.05~0.1=温和过滤；0.3~0.5=较强过滤。推荐与 Top-P 配合使用，保持 0.05~0.1。"
  # 局部典型采样，1.0=禁用
  - flag: typical
    label: 局部典型采样
    type: String
    default: "1.0"
    group: sampling
    advanced: true
    tooltip: "Locally Typical Sampling：基于信息量的采样策略，使输出更典型。1.0=禁用（默认）。0.5~0.9=启用。一般场景无需开启，对特定任务（如翻译）可能有帮助。"
  # 重复惩罚系数，1.0=禁用
  - flag: repeat-penalty
    label: 重复惩罚
    type: String
    default: "1.1"
    group: sampling
    enabled: true
    tooltip: "重复惩罚系数，抑制连续重复。1.0=禁用；>1.0=惩罚重复。默认 1.1。1.05~1.1=轻度（推荐）；1.2~1.3=较强。过高会导致用词贫乏。对中文模型建议 1.0~1.1。"
  # 基于 token 频率的惩罚
  - flag: frequency-penalty
    label: 频率惩罚
    type: String
    default: "0.0"
    group: sampling
    enabled: true
    tooltip: "频率惩罚：基于 token 出现频率的惩罚。频率越高的 token 被惩罚越重。0.0=禁用（默认）。0.1~0.5=轻度；1.0~2.0=较强。与 repeat-penalty 互补，可同时使用。"
  # token 出现即惩罚
  - flag: presence-penalty
    label: 存在惩罚
    type: String
    default: "0.0"
    group: sampling
    enabled: true
    tooltip: "存在惩罚：只要 token 出现过就施加固定惩罚（不关心频率）。鼓励模型谈论新话题。0.0=禁用（默认）。0.1~0.5=轻度；1.0~2.0=较强。适合长对话/写作场景。"
  # Mirostat 自适应采样模式
  - flag: mirostat
    label: Mirostat 模式
    type: Combo
    default: "0"
    group: sampling
    options: ["0", "1", "2"]
    tooltip: "Mirostat 自适应采样。自动调节温度以维持目标困惑度。0=禁用；1=Mirostat 1.0；2=Mirostat 2.0（推荐）。启用后 Top-K/Top-P/Min-P 被忽略。适合追求稳定质量的场景。"
  # Mirostat 学习率，仅 mirostat≠0 时生效
  - flag: mirostat-lr
    label: Mirostat 学习率
    type: String
    default: "0.1"
    group: sampling
    requires:
      - {flag: mirostat, op: "!=", value: "0"}
    tooltip: "Mirostat 学习率（eta）。控制对目标熵的追踪速度。越大调整越快但可能不稳定。默认 0.1。0.05~0.2 均可。仅在 Mirostat 模式 != 0 时生效。"
  # Mirostat 目标熵，仅 mirostat≠0 时生效
  - flag: mirostat-ent
    label: Mirostat 目标熵
    type: String
    default: "5.0"
    group: sampling
    requires:
      - {flag: mirostat, op: "!=", value: "0"}
    tooltip: "Mirostat 目标熵（tau）。控制输出的困惑度/多样性。值越大输出越多样。默认 5.0。3.0~8.0 均可。仅在 Mirostat 模式 != 0 时生效。"
  # BNF 语法约束输出
  - flag: grammar
    label: BNF 语法
    type: String
    default: ""
    group: sampling
    tooltip: "BNF-like 语法约束。强制模型输出符合指定语法结构。用于结构化输出（如 SQL、代码）。语法文件在 grammars/ 目录。一般场景用 JSON Schema 更方便。"
  # JSON Schema 约束输出
  - flag: json-schema
    label: JSON Schema
    type: String
    default: ""
    group: sampling
    tooltip: "JSON Schema 约束。强制模型输出符合指定的 JSON Schema。用于 API 返回结构化数据。如 {type:object,properties:{name:{type:string}}}。"
  # ---------------- 推测解码 ----------------
  # 推测解码类型：draft=外部草稿模型，draft-mtp=模型自带 MTP 层
  - flag: spec-type
    label: 推测类型
    role: spec_type
    type: Combo
    default: "draft-mtp"
    group: spec
    enabled: true
    options: [draft, draft-mtp, draft-mtp-v3]
    tooltip: "推测解码类型。draft=外部草稿模型；draft-mtp=模型自带 MTP 层（Qwen3 等原生支持）；draft-mtp-v3=MTP v3 版本。Qwen3 系列推荐 draft-mtp，可加速 2~3 倍。无 MTP 的模型用 draft + 独立草稿模型。"
  # 每步最大草稿 token 数
  - flag: spec-draft-n-max
    label: 最大草稿 Token
    type: String
    default: "2"
    group: spec
    enabled: true
    requires:
      - {flag: spec-type, op: enabled}
    tooltip: "每次推测生成的最大草稿 token 数。越大越快但接受率可能下降。默认 3。2~5=平衡（推荐）；8~10=激进。24GB 显卡跑 27B 建议 2~3。接受率低于 50% 时应减小此值。"
  # 草稿 token 最低接受概率
  - flag: spec-draft-p-min
    label: 草稿接受阈值
    type: String
    default: ""
    group: spec
    requires:
      - {flag: spec-type, op: enabled}
    tooltip: "草稿 token 的最低接受概率。低于此值的草稿 token 被拒绝。默认 0.0（全部接受）。带宽受限时设为 0.60~0.75 可提升质量。一般保持默认。"
  # 草稿模型 CPU 线程数
  - flag: threads-draft
    label: 草稿线程数
    type: String
    default: ""
    group: spec
    requires:
      - {flag: spec-type, op: enabled}
    tooltip: "草稿模型的 CPU 生成线程数。默认与 --threads 相同。使用外部草稿模型时可单独设置以平衡 CPU 负载。使用 draft-mtp 时无需设置。"
  # ---------------- 多模态 ----------------
  # 多模态投影仪（由启动器"多模态"专用输入行管理，此处隐藏避免重复注入）
  - flag: mmproj
    label: 多模态投影
    type: String
    default: ""
    group: mm
    hidden: true
    tooltip: "多模态投影仪 GGUF 文件路径。启用视觉/音频等多模态能力。需与基础语言模型配对使用。如 Qwen2.5-VL 的 mmproj 文件。本地文件路径或 HuggingFace 均可。（此参数由启动器上方的专用输入行管理）"
  # 本地媒体根目录，API 以 file:// 相对路径访问
  - flag: media-path
    label: 媒体根目录
    type: String
    default: ""
    group: mm
    tooltip: "本地媒体文件的根目录。API 可通过 file:// 相对路径访问此目录下的图片/视频。用于多模态推理时加载本地媒体资源。"
  # ---------------- 并行与序列 ----------------
  # 并发槽位数，每槽位独立 KV 显存
  - flag: parallel
    label: 并行序列数
    type: String
    default: "1"
    group: parallel
    enabled: true
    tooltip: "服务器并发槽位数（同时处理的请求数）。默认 -1=自动。1=单用户（推荐本地使用）；2~4=多用户并发。每个槽位占用独立的 KV 缓存空间，增加会线性增加显存占用。MTP 推测解码建议保持 1。"
  # [已废弃] 旧版序列数参数
  - flag: sequences
    label: 序列数 (旧版)
    type: String
    default: "1"
    group: parallel
    advanced: true
    deprecated: true
    tooltip: "旧版并行序列数参数，已被 --parallel 取代。保持默认值即可。"
  # ---------------- 模板与对话 ----------------
  # Jinja2 模板引擎处理聊天模板
  - flag: jinja
    label: 启用 Jinja
    type: Bool
    default: "true"
    group: template
    tooltip: "启用 Jinja2 模板引擎处理聊天模板。默认开启。大多数模型需要 Jinja 正确格式化对话。禁用后使用内置的简单模板，可能导致对话格式错误。建议保持开启。"
  # 内联自定义聊天模板，与模板文件互斥
  - flag: chat-template
    label: 自定义模板
    type: String
    default: ""
    group: template
    conflicts: [chat-template-file]
    tooltip: "自定义 Jinja 聊天模板字符串。覆盖模型自带的模板。支持的内置模板名：chatml, llama2, llama3, gemma, mistral, deepseek 等。一般无需设置，使用模型自带模板即可。"
  # 从文件加载聊天模板，与内联模板互斥
  - flag: chat-template-file
    label: 模板文件
    type: String
    default: ""
    group: template
    conflicts: [chat-template]
    tooltip: "从文件加载自定义聊天模板。与 --chat-template 功能相同但内容从文件读取。适合模板较长时使用。"
  # ---------------- 扩展功能 ----------------
  # 日志详细度 0~5
  - flag: verbosity
    label: 日志详细度
    type: String
    default: "3"
    group: ext
    advanced: true
    tooltip: "日志输出详细程度。0=仅关键信息；1=错误；2=警告；3=信息（默认）；4=追踪；5=调试。调试时设 4~5；日常使用 2~3；安静模式 0~1。"
  # 启用 /embedding 端点（需专用 Embedding 模型）
  - flag: embedding
    label: 启用 Embedding
    type: Bool
    default: "false"
    group: ext
    advanced: true
    tooltip: "启用 Embeddings API 端点（/embedding）。需要使用专门的 Embedding 模型（如 nomic-embed、bge 等）。启用后只能用于 Embedding，不能用于文本生成。普通对话场景不要开启。"
  # 启用 /metrics 监控端点（启动器性能面板依赖）
  - flag: metrics
    label: 启用 Metrics
    role: metrics
    type: Bool
    default: "true"
    group: ext
    advanced: true
    tooltip: "启用 Prometheus 兼容的 /metrics 监控端点。启动器用它在运行中实时读取 TPS / Prefill / 首Token（也可在接管已有 Llama 进程时显示指标）。仅监听本机，安全无虞。"
  # 暴露 /slots 端点显示槽位状态
  - flag: slots
    label: 显示槽位
    type: Bool
    default: "false"
    group: ext
    advanced: true
    tooltip: "暴露 /slots 端点，显示各推理槽位的状态（正在处理、空闲等）。默认开启。调试并发问题时有用。安全敏感环境建议关闭。"
  # LoRA 适配器路径，逗号分隔多个
  - flag: lora
    label: LoRA
    type: String
    default: ""
    group: ext
    advanced: true
    tooltip: "LoRA 适配器路径。在基础模型上叠加微调效果。支持多个适配器（逗号分隔）。格式：文件路径。无需重启可通过 API 热切换。"
  # LoRA 适配器(路径:比例)
  - flag: lora-scaled
    label: LoRA (带比例)
    type: String
    default: ""
    group: ext
    advanced: true
    tooltip: "带缩放因子的 LoRA。格式：路径:比例，如 adapter.safetensors:0.8。比例控制 LoRA 影响强度，0.0~1.0。多个适配器用逗号分隔。"
  # 控制向量路径，逗号分隔叠加
  - flag: control-vector
    label: 控制向量
    type: String
    default: ""
    group: ext
    advanced: true
    tooltip: "控制向量（Control Vector）路径。通过向量运算引导模型行为（如更积极/更谨慎）。多个向量可逗号分隔叠加使用。"
  # 控制向量(路径:比例)
  - flag: control-vector-scaled
    label: 控制向量 (带比例)
    type: String
    default: ""
    group: ext
    advanced: true
    tooltip: "带缩放因子的控制向量。格式：路径:比例。比例控制向量影响强度。负值可反转效果。多个用逗号分隔。"
  # 空闲 N 秒后卸载模型释放显存，-1=禁用
  - flag: sleep-idle-seconds
    label: 休眠空闲秒数
    type: String
    default: "-1"
    group: ext
    tooltip: "空闲多少秒后服务器自动休眠（卸载模型释放显存）。-1=禁用（默认）。设为 300~600 可在闲置时释放显存给其他程序。收到新请求时自动唤醒（需重新加载模型）。"
