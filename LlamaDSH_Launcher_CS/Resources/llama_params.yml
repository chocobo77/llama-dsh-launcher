  # ================================================================
  # KV 缓存
  # ================================================================
  - flag: cache-type-k
    subgroup: KV 缓存与量化
    subgroup: KV 缓存与量化
    label: Cache 类型 K
    role: cache_type_k
    type: Combo
    default: "q8_0"
    group: common
    enabled: true
    options: [f32, f16, bf16, q8_0, q4_0, q4_1, iq4_nl, q5_0, q5_1, q6_0, tq3_0]
    tooltip: "KV 缓存 K 分量的数据类型。官方支持：f32/f16/bf16/q8_0/q4_0/q4_1/iq4_nl/q5_0/q5_1（默认 f16）。低 bit 可大幅扩展上下文（配合 Hadamard 旋转质量提升）。q6_0 与 tq3_0(TurboQuant 3.5bit) 为实验性/视构建版本而定，官方主线暂不支持，请确认你的 llama.cpp 包含该类型。24GB 显卡跑 27B 推荐 q8_0 或 q4_0。"

  - flag: cache-type-v
    subgroup: KV 缓存与量化
    subgroup: KV 缓存与量化
