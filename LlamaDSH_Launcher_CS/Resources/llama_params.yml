    tooltip: "KV 缓存 V 分量的数据类型。V 对精度不如 K 敏感，可更激进压缩。官方支持：f32/f16/bf16/q8_0/q4_0/q4_1/iq4_nl/q5_0/q5_1（默认 f16）。默认 q8_0 为官方兼容且质量/空间均衡；q4_0 可进一步省显存；tq3_0(TurboQuant) 仅特定 fork 支持，官方主线会报错，请勿在官方版选用。"

