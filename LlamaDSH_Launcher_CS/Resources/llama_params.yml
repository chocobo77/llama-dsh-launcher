# =====================================================================
# LlamaDSH 启动器 · llama.cpp 启动参数配置（唯一升级入口）
# 加载顺序: 内置默认 → 本文件(优先) → ~/.llamadsh/params_override.yml(差异覆盖)
# 最后更新: 2026-08-31 (基于 llama.cpp b10441+ / v0.3.0)
# 核心功能: 思考强度控制 (reasoning / reasoning-effort / reasoning-budget / reasoning-preserve)
# =====================================================================
meta:
  schema: 5
  adapt: "llama-server 0.5.0-dev (b11243, fc07d781e) 已验证 · schema v5（2026-09-29 顶层分组照搬官方分节 common/sampling/speculative/server，子组按官方 help 顺序切块）"
  notes: >
    llama.cpp 更新时的维护方法（改完点启动器"⟳ 重载参数配置"即时生效）:
    1. 新增参数: 在 params 下加一条, 必填 flag/label/type/default/group
    2. 改名参数: 更新 flag, 并把旧名写进 aliases, 旧 profile 的值会自动迁移
    3. 弃用参数: 设 deprecated: true 或在 override 层 hidden: true
    4. role 是启动器内部逻辑(显存估算/归一化)绑定的语义名, 改 flag 时保留 role 原值即可
    5. 2026年8月重大变更: --mmap/--no-mmap/--mlock/--direct-io 已统一合并为 --load-mode
    6. --no-cnv CLI 选项已移除
    7. --fit 现默认开启，自动适配显存，多数情况下无需手动干预
    8. 采样器生态全面更新: 新增 Dynatemp/XTC/Adaptive-P/DRY 等高级采样策略
    9. 【核心功能】思考强度控制: 推荐用 reasoning/reasoning-effort/reasoning-format 专有参数，
       也可用 chat-template-kwargs 的 reasoning_effort 调节；reasoning-budget 控制思考 token 预算
    10. 【v4 核心语义】offValue/offFlag: 对 llama 默认值不是"关闭"的选项，取消勾选会显式发射
        关闭旗标(--spec-type none / --flash-attn off / --no-jinja 等)，取消勾选=真正关闭；
        spec 子参数的前置从"已启用"改为"spec-type != none"，勾选 none 同样视为关闭
    11. 【v4 层级】组内新增 subgroup 两级小节；移除 0.5.0 已删除参数:
        spec-draft-ctx-size / spec-draft-replace / verbose-prompt / no-display-prompt / system-prompt-file

groups:
  # 顶层四组照搬 llama-server --help 官方分节:
  # common params / sampling params / speculative params / example-specific params
  # 子组按官方 help 各节内的排列顺序切块
  - {id: common,   title: 通用与加载 (common),   order: 0}
  - {id: sampling, title: 采样控制 (sampling),   order: 1}
  - {id: spec,     title: 推测解码 (speculative), order: 2}
  - {id: server,   title: 服务与扩展 (server),   order: 3}

params:
  # ================================================================
  # 基础设置
  # ================================================================
  - flag: alias
    subgroup: 模型来源
    subgroup: 模型来源
    label: 别名 (Alias)
    type: String
    default: "qwen3.8-27b"
    group: common
    enabled: true
    tooltip: "模型别名，用于 API 返回中的 model 字段标识。建议设为模型简称，方便上层应用识别。"

  - flag: host
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: 主机 (Host)
    role: host
    type: String
    default: "127.0.0.1"
    group: server
    enabled: true
    tooltip: "监听 IP 地址。127.0.0.1 仅本机可访问；0.0.0.0 允许局域网访问（注意安全风险）。也支持 UNIX socket 路径（以 .sock 结尾）。建议：本地使用保持 127.0.0.1。"

  - flag: port
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: 端口 (Port)
    role: port
    type: String
    default: "1234"
    group: server
    enabled: true
    tooltip: "HTTP 监听端口，范围 1-65535。llama-server 默认 8080，此启动器默认 1234 以避免与其他服务冲突。"

  - flag: timeout
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: 超时 (Timeout)
    type: String
    default: "600"
    group: server
    enabled: true
    tooltip: "llama-server 读写超时（秒）。超时后断开空闲连接。长文本生成建议 >=300s，多轮对话建议 600s。设为 0 表示永不超时。"

  - flag: ctx-size
    subgroup: 上下文与批处理
    subgroup: 上下文与批处理
    label: 上下文大小 (Context)
    role: ctx_size
    type: String
    default: "0"
    group: common
    enabled: true
    tooltip: "Prompt 上下文窗口长度（token 数）。设为 0 时由 --fit 根据显存自动适配。支持 K/M 后缀（如 100K=102400）。27B Q4 模型 24GB 显卡建议 40K~48K；100K 以上极易 OOM。启动前会自动估算显存并预警。"

  - flag: keep
    subgroup: 上下文与批处理
    subgroup: 上下文与批处理
    label: 保留 Token 数
    type: String
    default: "0"
    group: common
    tooltip: "从初始提示中保留的 token 数量。0=不保留，-1=全部保留。用于在多轮对话中保留系统提示等固定前缀。"

  - flag: batch-size
    subgroup: 上下文与批处理
    subgroup: 上下文与批处理
    label: 批处理大小 (Batch Size)
    role: batch_size
    type: String
    default: "2048"
    group: common
    enabled: true
    tooltip: "逻辑最大批处理大小。控制 prompt 处理时一次送入模型的 token 上限。增大可加速 prompt 处理但增加显存占用。默认 2048，24GB 显卡建议 2048~4096。"

  - flag: ubatch-size
    subgroup: 上下文与批处理
    subgroup: 上下文与批处理
    label: 微批大小 (Ubatch)
    role: ubatch_size
    type: String
    default: "512"
    group: common
    enabled: true
    validate: {leq: batch-size}
    tooltip: "物理微批处理大小。实际每次送入推理引擎的 token 数，必须 <= batch-size。较小值降低延迟但降低吞吐。默认 512，显存充裕可提至 1024。"

  - flag: threads
    subgroup: 进程与 CPU 亲和
    subgroup: 进程与 CPU 亲和
    label: 线程数 (Threads)
    role: threads
    type: String
    default: "$cpu"
    group: common
    enabled: true
    tooltip: "生成阶段使用的 CPU 线程数。默认 -1 = 自动（使用全部物理核心）。建议设为 CPU 物理核心数（不含超线程），过多反而因上下文切换降低性能。"

  - flag: gpu-layers
    subgroup: 后端与显存
    subgroup: 后端与显存
    label: GPU 层数
    role: ngl
    type: String
    default: "auto"
    group: common
    enabled: true
    aliases: [n-gpu-layers]
    tooltip: "卸载到 GPU 的模型层数。0=纯 CPU；99/auto=自动配平。27B Q4 模型 24GB 显卡建议留空让 --fit 自动分配。显存不足时 --fit 会自动将部分层移至 CPU。"

  - flag: main-gpu
    subgroup: 后端与显存
    subgroup: 后端与显存
    label: 主 GPU 编号
    type: String
    default: "0"
    group: common
    enabled: true
    tooltip: "主 GPU 设备编号（从 0 开始）。单卡用户保持 0。多卡时指定存放中间结果和 KV 缓存的 GPU。"

  - flag: threads-http
    subgroup: 服务管理
    subgroup: 服务管理
    label: HTTP 线程数
    type: String
    default: "-1"
    group: server
    tooltip: "处理 HTTP 请求的线程数。默认 -1 = 自动（通常为 8）。高并发场景可适当增加，但过多会与推理线程争抢 CPU。建议：单用户保持 -1；多用户可设 4~8。"

  - flag: api-key
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: API 密钥
    type: String
    default: ""
    group: server
    tooltip: "API 认证密钥，多个用逗号分隔。留空表示无需认证。暴露在公网时务必设置，否则任何人都能调用你的模型。"

  - flag: api-key-file
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: API 密钥文件
    type: String
    default: ""
    group: server
    tooltip: "从文件读取 API 密钥，每行一个，# 开头为注释。与 api-key 二选一或互补。"

  - flag: ssl-key-file
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: SSL 私钥文件
    type: String
    default: ""
    group: server
    suggests: [ssl-cert-file]
    tooltip: "PEM 格式的 SSL 私钥文件路径。与证书文件配合启用 HTTPS 加密通信。本地使用无需设置。"

  - flag: ssl-cert-file
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: SSL 证书文件
    type: String
    default: ""
    group: server
    suggests: [ssl-key-file]
    tooltip: "PEM 格式的 SSL 证书文件路径。需与私钥文件配对使用。可用 Let's Encrypt 等免费证书。"

  - flag: cors-origins
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: CORS 允许来源
    type: String
    default: ""
    group: server
    tooltip: "跨域资源共享（CORS）允许的来源列表，逗号分隔。留空默认允许所有来源（*）。Web 前端跨域访问时需设置为前端域名。设为 localhost 只反射本机 Origin。"

  - flag: cors-methods
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: CORS 允许方法
    type: String
    default: ""
    group: server
    advanced: true
    tooltip: "CORS 允许的 HTTP 方法，逗号分隔。官方默认 GET, POST, DELETE, OPTIONS。留空=官方默认。"

  - flag: cors-headers
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: CORS 允许请求头
    type: String
    default: ""
    group: server
    advanced: true
    tooltip: "CORS 允许的请求头，逗号分隔。官方默认 *（全部）。留空=官方默认。"

  - flag: cors-credentials
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: CORS 允许凭证
    type: Bool
    default: "true"
    group: server
    advanced: true
    tooltip: "是否允许 CORS 携带凭证（--cors-credentials / --no-cors-credentials）。官方默认开启。注意：启用工具(--tools/--agent)时官方会把 cors-origins 限制为 localhost。"
    offFlag: no-cors-credentials

  - flag: api-prefix
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: API 前缀路径
    type: String
    default: ""
    group: server
    advanced: true
    tooltip: "服务器提供服务的路径前缀（不带末尾斜杠）。如设为 /api 则接口位于 /api/v1/...。留空=无前缀。"

  - flag: reuse-port
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: 端口复用
    type: Bool
    default: "false"
    group: server
    advanced: true
    tooltip: "允许多个 socket 绑定同一端口（--reuse-port）。默认关闭。一般无需开启。"

  - flag: path
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: 静态文件目录
    type: String
    default: ""
    group: server
    advanced: true
    tooltip: "从该目录提供静态文件服务。留空=不提供静态文件。"

  - flag: tags
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: 模型标签
    type: String
    default: ""
    group: server
    advanced: true
    tooltip: "为模型设置标签（逗号分隔，仅信息用途，不参与路由）。"

  - flag: offline
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: 离线模式
    type: Bool
    default: "false"
    group: server
    advanced: true
    tooltip: "离线模式：强制使用缓存，阻止任何网络访问。配合 -hf/--model-url 下载场景禁用。"

  - flag: load-mode
    subgroup: 后端与显存
    subgroup: 后端与显存
    label: 模型加载模式
    type: Combo
    default: "auto"
    group: common
    options: [auto, none, mmap, mlock, mmap+mlock, dio]
    tooltip: "模型加载模式。auto=自动选择（CUDA/ROCm 和 Vulkan iGPU 上自动禁用 mmap）；none=无特殊模式（等价旧 --no-mmap）；mmap=内存映射（按需加载，省内存）；mlock=锁定到物理内存（防交换）；mmap+mlock=两者结合；dio=使用 DirectIO。推荐 auto。旧参数 --mmap/--no-mmap/--mlock/--direct-io 已合并为此参数。"

  - flag: model-url
    subgroup: 模型来源
    subgroup: 模型来源
    label: 模型下载 URL
    type: String
    default: ""
    group: common
    advanced: true
    tooltip: "模型直接下载 URL（-mu）。通常不直接使用，推荐用 hf-repo 指定 Hugging Face 仓库。"

  - flag: hf-repo
    subgroup: 模型来源
    subgroup: 模型来源
    label: HuggingFace 仓库
    type: String
    default: ""
    group: common
    advanced: true
    tooltip: "Hugging Face 模型仓库（-hf）。格式: <user>/<model>[:quant]。quant 可选，不区分大小写，默认 Q4_K_M（不存在则取仓库第一个文件）。mmproj 会自动下载，禁用加 --no-mmproj。示例: ggml-org/GLM-4.7-Flash-GGUF:Q4_K_M"

  - flag: hf-file
    subgroup: 模型来源
    subgroup: 模型来源
    label: HF 指定文件
    type: String
    default: ""
    group: common
    advanced: true
    tooltip: "Hugging Face 模型文件名（-hff）。指定后覆盖 hf-repo 中的 quant 设置。"

  - flag: hf-token
    subgroup: 模型来源
    subgroup: 模型来源
    label: HF 访问令牌
    type: String
    default: ""
    group: common
    advanced: true
    tooltip: "Hugging Face 访问令牌（-hft）。留空=使用 HF_TOKEN 环境变量。访问私有模型时需要。"

  - flag: docker-repo
    subgroup: 模型来源
    subgroup: 模型来源
    label: Docker 模型仓库
    type: String
    default: ""
    group: common
    advanced: true
    tooltip: "Docker Hub 模型仓库（-dr）。格式: [<repo>/]<model>[:quant]。repo 可选默认 ai/，quant 可选默认 :latest。示例: gemma3"

  - flag: ui
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: 启用 Web UI
    type: Bool
    default: "true"
    group: server
    tooltip: "是否启用内置 Web UI。默认开启。纯 API 服务可关闭以节省资源。"
    offFlag: no-ui

  - flag: sse-ping-interval
    subgroup: 服务监听与安全
    subgroup: 服务监听与安全
    label: SSE Ping 间隔
    type: String
    default: "30"
    group: server
    tooltip: "SSE 心跳间隔（秒）。-1=禁用。默认 30。保持连接活跃，防止代理超时断开。"

  - flag: system-prompt-file
    subgroup: 服务管理
    subgroup: 服务管理
    deprecated: true
    label: 系统提示文件
    type: String
    default: ""
    group: server
    hidden: true
    deprecated: true
    tooltip: "已废弃：llama-server 不支持 --system-prompt-file（该参数仅 llama-cli 等可用，已从 server 参数中排除）。如需固定系统提示，请在调用方注入 system 消息。"

  # ================================================================
  # 性能与内存
  # ================================================================
  - flag: flash-attn
    subgroup: 注意力与性能
    subgroup: 注意力与性能
    label: Flash Attention
    type: Combo
    default: "on"
    group: common
    offValue: "off"
    enabled: true
    options: ["on", "off", "auto"]
    tooltip: "Flash Attention 加速。需要 GPU 硬件支持（AMD RDNA2+/NVIDIA Ampere+）。可显著降低长上下文的显存占用并加速推理。推荐 on；若启动报错则改 auto。"

  - flag: tensor-split
    subgroup: 后端与显存
    subgroup: 后端与显存
    label: 张量拆分
    type: String
    default: ""
    group: common
    tooltip: "多 GPU 张量拆分比例，逗号分隔。如 '3,5' 表示第一块 GPU 占 3/8、第二块占 5/8。按显存大小比例分配。单卡无需设置。DeepSeek 4 新增 -sm tensor 模式。"

  - flag: threads-batch
    subgroup: 进程与 CPU 亲和
    subgroup: 进程与 CPU 亲和
    label: 批处理线程数
    type: String
    default: ""
    group: common
    tooltip: "Prompt 处理（批处理）时的 CPU 线程数。默认与 --threads 相同。Prompt 处理是计算密集型，可适当增加线程数以加速首次响应。"

  - flag: cpu-mask
    subgroup: 进程与 CPU 亲和
    subgroup: 进程与 CPU 亲和
    label: CPU 亲和性掩码
    type: String
    default: ""
    group: common
    advanced: true
    tooltip: "CPU 亲和性掩码（十六进制）。与 cpu-range 互补。用于将推理线程绑定到特定 CPU 核心。"

  - flag: cpu-range
    subgroup: 进程与 CPU 亲和
    subgroup: 进程与 CPU 亲和
    label: CPU 亲和性范围
    type: String
    default: ""
    group: common
    advanced: true
    tooltip: "CPU 亲和性范围，格式: lo-hi。与 cpu-mask 互补。用于将推理线程绑定到特定 CPU 核心范围。"

  - flag: cpu-strict
    subgroup: 进程与 CPU 亲和
    subgroup: 进程与 CPU 亲和
    label: 严格 CPU 放置
    type: Bool
    default: "false"
    group: common
    advanced: true
    tooltip: "是否使用严格的 CPU 放置策略。启用后强制线程只运行在指定的 CPU 核心上。"

  - flag: prio
    subgroup: 进程与 CPU 亲和
    subgroup: 进程与 CPU 亲和
    label: 进程优先级
    type: Combo
    default: "0"
    group: common
    advanced: true
    options: ["-1", "0", "1", "2", "3"]
    tooltip: "进程/线程优先级。-1=低，0=正常，1=中，2=高，3=实时。默认 0。"

  - flag: prio-batch
    subgroup: 进程与 CPU 亲和
    subgroup: 进程与 CPU 亲和
    label: 批处理优先级
    type: Combo
    default: "0"
    group: common
    advanced: true
    options: ["0", "1", "2", "3"]
    tooltip: "批处理阶段的进程/线程优先级。0=正常，1=中，2=高，3=实时。默认 0。"

  - flag: poll
    subgroup: 进程与 CPU 亲和
    subgroup: 进程与 CPU 亲和
    label: 轮询级别
    type: String
    default: "50"
    group: common
    advanced: true
    tooltip: "轮询级别（0-100），用于等待工作。0=无轮询，默认 50。较高值可降低延迟但增加 CPU 占用。"

  - flag: poll-batch
    subgroup: 进程与 CPU 亲和
    subgroup: 进程与 CPU 亲和
    label: 批处理轮询模式
    type: Bool
    default: "false"
    group: common
    advanced: true
    tooltip: "批处理阶段是否使用轮询等待工作。默认与 --poll 相同。"

  - flag: cpu-mask-batch
    subgroup: 进程与 CPU 亲和
    subgroup: 进程与 CPU 亲和
    label: 批处理 CPU 亲和性掩码
    type: String
    default: ""
    group: common
    advanced: true
    tooltip: "批处理阶段的 CPU 亲和性掩码（十六进制）。默认与 cpu-mask 相同。"

  - flag: cpu-range-batch
    subgroup: 进程与 CPU 亲和
    subgroup: 进程与 CPU 亲和
    label: 批处理 CPU 亲和性范围
    type: String
    default: ""
    group: common
    advanced: true
    tooltip: "批处理阶段的 CPU 亲和性范围，格式: lo-hi。默认与 cpu-range 相同。"

  - flag: cpu-strict-batch
    subgroup: 进程与 CPU 亲和
    subgroup: 进程与 CPU 亲和
    label: 批处理严格 CPU 放置
    type: Bool
    default: "false"
    group: common
    advanced: true
