    label: Top-K
    type: String
    default: "40"
    group: sampling
    enabled: true
    tooltip: "Top-K 采样：仅从概率最高的 K 个 token 中采样。K 越小输出越保守。默认 40。设为 1=贪心；10~40=平衡；0=禁用（仅用 Top-P/Min-P）。建议配合 Top-P 使用，保持默认 40。"

  - flag: top-p
    subgroup: 基础采样
    subgroup: 基础采样
    label: Top-P
    type: String
    default: "0.95"
    group: sampling
    enabled: true
    tooltip: "核采样（Nucleus Sampling）：从累计概率达到 P 的最小 token 集合中采样。P 越小输出越集中。默认 0.95。0.9=保守；1.0=禁用。建议 0.9~0.95，配合 Min-P 效果更佳。"

  - flag: min-p
    subgroup: 基础采样
