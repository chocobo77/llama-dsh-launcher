    label: Min-P
    type: String
    default: "0.05"
    group: sampling
    enabled: true
    tooltip: "Min-P 采样：过滤掉概率低于最高概率 * min_p 的 token。比 Top-P 更直观的截断方式。默认 0.05。0.05~0.1=温和过滤；0.3~0.5=较强过滤。推荐与 Top-P 配合使用，保持 0.05~0.1。"

  - flag: top-nsigma
