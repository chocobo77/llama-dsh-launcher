<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Harness &amp; Llama 启动器(Linux)</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <!-- ==================== 左列 ==================== -->
  <div class="col">
    <div class="topbtns">
      <button id="btnSaveCfg" title="保存到当前配置文件">💾 保存配置</button>
      <button id="btnExportCfg" title="另存为(浏览器下载)">📤 另存为</button>
      <button id="btnImportCfg" title="从 JSON 文件导入">📥 加载配置</button>
      <button id="btnChangePath" title="更改配置文件所在目录">📁 更改路径</button>
      <input type="file" id="fileImport" accept=".json" style="display:none">
    </div>
    <div class="row">
      <span class="lbl">方案:</span>
      <select id="comboProfile" class="fill" style="max-width:220px"></select>
      <button id="btnProfSave" class="small">💾 保存</button>
      <button id="btnProfRename" class="small">✏️ 重命名</button>
      <button id="btnProfNew" class="small">➕ 新建</button>
      <button id="btnProfDel" class="small">🗑 删除</button>
    </div>

    <fieldset>
      <legend>📂 路径配置</legend>
      <div class="row"><span class="lbl">模型文件</span>
        <input type="text" id="inModel" class="fill mono" placeholder="GGUF 文件 / 分片第一片 / 目录(自动解析)">
        <button data-br="inModel" data-mode="model" class="small">浏览...</button>
        <button data-br="inModel" data-mode="dir" class="small">📁 目录</button>
      </div>
      <div class="row"><span class="lbl">草稿模型(MTP)</span>
        <input type="text" id="inMtp" class="fill mono">
        <button data-br="inMtp" data-mode="file" class="small">浏览...</button>
      </div>
      <div class="row"><span class="lbl">mmproj 投影</span>
        <input type="text" id="inMmproj" class="fill mono">
        <button data-br="inMmproj" data-mode="file" class="small">浏览...</button>
      </div>
      <div class="row"><span class="lbl">mmproj URL</span>
        <input type="text" id="inMmprojUrl" class="fill mono">
      </div>
      <div class="row">
        <label><input type="checkbox" id="chkNoMmprojOffload"> --no-mmproj-offload(投影留在 CPU)</label>
      </div>
      <hr style="border-color:var(--border);border-style:dashed">
      <div class="row"><span class="lbl">llama.cpp 目录</span>
        <input type="text" id="inLlamaDir" class="fill mono" placeholder="含 llama-server 的目录(留空回退 D:\llama.cpp 语义 → ~/llama.cpp)">
        <button data-br="inLlamaDir" data-mode="dir" class="small">浏览...</button>
        <button id="btnSearchLlama" class="small" title="自动检索 llama-server">🔍 自动检索</button>
        <button id="btnUpdLlama" class="small" title="从 GitHub Releases 更新(Vulkan-x64 优先)">🔄 检查更新</button>
      </div>
      <div class="row"><span class="lbl">DSH 目录</span>
        <input type="text" id="inDshDir" class="fill mono" placeholder="deepseek-harness 仓库根">
        <button data-br="inDshDir" data-mode="dir" class="small">浏览...</button>
        <button id="btnSearchDsh" class="small">🔍 自动检索</button>
        <button id="btnUpdDsh" class="small" title="git pull --ff-only">🔄 检查更新</button>
      </div>
      <hr style="border-color:var(--border);border-style:dashed">
      <div class="row"><span class="lbl">DSH 选项</span>
        <select id="comboDshMode">
          <option value="0">编译版 (node lib/bin.js,优先)</option>
          <option value="1">一键部署 (npx --yes @deepseek-ai/dsh web)</option>
        </select>
        <label title="sudo -n 静默提权运行(原版用于读取 Windows 游戏内存;Linux 上仅在需要 root 网络权限时使用)"><input type="checkbox" id="chkDshAdmin"> 提权启动(sudo)</label>
      </div>
      <div class="row"><span class="lbl">维护工具</span>
        <button id="btnCompat" class="small">🩺 兼容性检查/修复</button>
        <button id="btnPlugins" class="small">🧩 插件智能检测/修复</button>
      </div>
    </fieldset>

    <div id="paramGroups"></div>

    <details open>
      <summary style="cursor:pointer;font-weight:600">📋 命令预览(点击折叠)</summary>
      <textarea id="cmdPreview" readonly spellcheck="false"></textarea>
      <div class="row">
        <button id="btnRefreshCmd" class="small">🔄 刷新命令</button>
        <button id="btnReloadSchema" class="small">⟳ 重载参数配置</button>
        <button id="btnCopyCmd" class="small">📋 复制命令</button>
      </div>
    </details>
  </div>

  <!-- ==================== 右列 ==================== -->
  <div class="col">
    <div class="row" style="justify-content:flex-end">
      <span class="tiny">Web 版常驻后台服务:关闭浏览器标签页不影响已启动的服务</span>
    </div>
    <fieldset>
      <legend>⚡ 服务与性能</legend>
      <div class="svcgrid">
        <div class="svc">
          <div class="btns">
            <button id="btnLlamaStart" class="primary">▶ 启动 Llama</button>
            <button id="btnLlamaStop" class="danger" disabled>⏹ 停止 Llama</button>
          </div>
          <span id="lblLlamaStatus" class="status st-stop">● 已停止</span>
        </div>
        <div class="svc">
          <div class="btns">
            <button id="btnDshStart" class="primary">▶ 启动 DSH Web</button>
            <button id="btnDshStop" class="danger" disabled>⏹ 停止 DSH Web</button>
            <button id="btnOpenDsh" disabled>🌐 打开 DSH Web</button>
          </div>
          <div class="btns">
            <button id="btnRebuildDsh" class="small">🔨 重建 DSH</button>
            <span id="lblDshStatus" class="status st-stop">● 已停止</span>
          </div>
        </div>
      </div>
      <div class="perf">
        <div class="cell"><div class="k">CPU</div><div class="v" id="pCpu">—</div></div>
        <div class="cell"><div class="k">内存</div><div class="v" id="pMem">—</div></div>
        <div class="cell"><div class="k">显卡</div><div class="v" id="pGpu">—</div></div>
        <div class="cell"><div class="k">显存</div><div class="v" id="pVram">—</div></div>
        <div class="cell"><div class="k">🌡显卡温度</div><div class="v" id="pTemp">—</div></div>
        <div class="cell"><div class="k">⚡TPS</div><div class="v" id="pTps">—</div></div>
        <div class="cell"><div class="k">⏱首Token</div><div class="v" id="pTtft">—</div></div>
        <div class="cell"><div class="k">📈Prefill</div><div class="v" id="pPf">—</div></div>
      </div>
      <div class="breaker">
        <label><input type="checkbox" id="chkBreaker"> 🔒 显存熔断</label>
        <select id="comboBreakerType">
          <option value="0">百分比(%)</option>
          <option value="1">固定值(GB)</option>
        </select>
        <input type="text" id="txtBreakerVal" style="width:64px" value="90">
        <span id="lblVramBreaker"></span>
      </div>
    </fieldset>

    <fieldset style="flex:1;display:flex;flex-direction:column">
      <legend>📝 运行日志</legend>
      <textarea id="logArea" readonly spellcheck="false" style="flex:1"></textarea>
      <div class="row">
        <button id="btnClearLog" class="small">🗑 清空日志</button>
        <button id="btnOpenLogDir" class="small">📂 打开日志目录</button>
        <label style="margin-left:auto"><input type="checkbox" id="chkAutoScroll" checked> 自动滚动</label>
      </div>
    </fieldset>
  </div>
</div>

<div id="overlay">
  <div id="modal">
    <div id="modalTitle"></div>
    <div id="modalBody"></div>
    <div id="modalExtra"></div>
    <div id="modalBtns"></div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
