[package]
name = "dsh-desktop-tauri"
version = "0.1.19"
description = "Tauri desktop shell for DSH"
edition = "2021"
publish = false

# If the Tauri CLI ever needs the library crate (mobile targets), this is the
# entry. Desktop runs entirely through src/main.rs.
[lib]
name = "dsh_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
